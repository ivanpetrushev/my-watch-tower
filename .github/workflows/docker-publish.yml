name: Build and Push Docker Images

on:
  push:
    tags:
      - '*'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/ivan.petrushev/my-watch-tower-backend
  FRONTEND_IMAGE: ghcr.io/ivan.petrushev/my-watch-tower-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # To be able to push to GitHub Container Registry
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and Push Backend
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend 
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}

      # Build and Push Frontend
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend 
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
